<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Press Counter</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f4f4f5;
      color: #18181b;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #18181b;
        color: #fafafa;
      }
    }
    main {
      text-align: center;
      padding: 2rem;
      border: 1px solid #d4d4d8;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      main {
        background: #27272a;
        border-color: #3f3f46;
      }
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }
    #output {
      font-size: 1.25rem;
      margin: 1rem 0 1.5rem;
    }
    button {
      font-size: 1rem;
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <main>
    <h1>Press Counter</h1>
    <p id="output" aria-live="polite">0 presses</p>
    <button id="press-button" type="button">Press me</button>
  </main>
  <script src="/app.js"></script>
  <script>
    (function () {
      var count = 0;
      var output = document.getElementById('output');
      var button = document.getElementById('press-button');
      button.addEventListener('click', function () {
        count = pressCounter.increment(count);
        output.textContent = pressCounter.formatCount(count);
      });
    })();
  </script>
</body>
</html>
